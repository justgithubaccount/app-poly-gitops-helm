apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat-api.fullname" . }}
  namespace: {{ include "chat-api.namespace" . }}
  labels:
    {{- include "chat-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat-api.selectorLabels" . | nindent 8 }}  
      annotations:
        openrouter.model: {{ .Values.openrouter.defaultModel | quote }}
    spec:
      serviceAccountName: {{ include "chat-api.serviceAccountName" . }}
      containers:
        - name: chat-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.env.OTEL_SERVICE_NAME | default "chat-api" | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_PROTOCOL | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.env.OTEL_TRACES_EXPORTER | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.env.OTEL_LOGS_EXPORTER | quote }}
            
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | default "production" | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | default "INFO" | quote }}
            - name: OPENROUTER_API_URL
              value: {{ .Values.openrouter.apiUrl | quote }}
            - name: OPENROUTER_MODEL  
              value: {{ .Values.openrouter.defaultModel | quote }}
            
            # Downward API metadata enriches application telemetry.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- if or .Values.createInternalSecret .Values.openrouterSecretRefName .Values.postgresSecretRefName }}
          envFrom:
            {{- if .Values.createInternalSecret }}
            - secretRef:
                name: {{ include "chat-api.fullname" . }}-config
            {{- end }}
            {{- if .Values.openrouterSecretRefName }}
            - secretRef:
                name: {{ .Values.openrouterSecretRefName }}
            {{- end }}
            {{- if .Values.postgresSecretRefName }}
            - secretRef:
                name: {{ .Values.postgresSecretRefName }}
            {{- end }}
          {{- end }}
                      
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
            
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
