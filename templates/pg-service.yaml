{{- if .Values.postgres.externalService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: {{ include "chat-api.namespace" . }}
  labels:
    app: {{ include "chat-api.name" . }}
    component: database
spec:
  type: ExternalName
  externalName: {{ .Values.postgres.externalService.host }}
  ports:
  - port: {{ .Values.postgres.externalService.port }}
    targetPort: {{ .Values.postgres.externalService.port }}
{{- end }}
