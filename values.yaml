replicaCount: 1
namespace: ""

image:
  repository: ghcr.io/justgithubaccount/app-poly-gitops-fastapi
  pullPolicy: IfNotPresent
  tag: "1.1.2"

containerPort: 8000
service:
  type: ClusterIP
  port: 80

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30

serviceAccount:
  create: true
  annotations: {}
  name: ""

env:
  OTEL_SERVICE_NAME: "chat-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

openrouter:
  apiUrl: "https://openrouter.ai/api/v1/chat/completions"
  defaultModel: "anthropic/claude-opus-4"
  # Optional provider attribution headers.
  # httpReferer: "https://your-domain.com"
  # xTitle: "Chat Microservice"

# Existing Secrets are optional so the health endpoint can start offline.
openrouterSecretRefName: ""
postgresSecretRefName: ""

postgres:
  externalService:
    enabled: false
    host: ""
    port: 5432

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  tls: false
  tlsSecretName: ""
  
# Additional container environment entries, including Secret key mappings.
extraEnv: []

createInternalSecret: false
